name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green:
    name: build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Commit the lockfile on the first green run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: add Cargo.lock"
            git push
          fi

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Add musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Build static releases
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --target aarch64-unknown-linux-musl

      - name: Smoke test the static binary
        run: |
          cat > smoke-buttons.json <<'JSON'
          {"buttons":[{"id":"ok","label":"Echo","program":"echo","args":["hello from btn"]}]}
          JSON
          BTN_ADDR=127.0.0.1:8799 BTN_TOKEN=smoke BTN_CONFIG=smoke-buttons.json \
            ./target/x86_64-unknown-linux-musl/release/btn-controll > smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8799/api/health > /dev/null 2>&1; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8799/api/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/buttons)" = "401"
          curl -fsS -H 'Authorization: Bearer smoke' http://127.0.0.1:8799/api/buttons | grep -q '"id":"ok"'
          curl -fsS -X POST -H 'Authorization: Bearer smoke' http://127.0.0.1:8799/api/buttons/ok/run | grep -q '"running":true'
          sleep 1
          curl -fsS -H 'Authorization: Bearer smoke' http://127.0.0.1:8799/api/buttons | grep -q 'hello from btn'
          curl -fsS http://127.0.0.1:8799/ | grep -q 'BTN Control'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/app.js)" = "200"
          echo 'smoke test passed'
          cat smoke.log

      - name: Upload x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: btn-controll-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/btn-controll
          if-no-files-found: error

      - name: Upload aarch64 binary
        uses: actions/upload-artifact@v4
        with:
          name: btn-controll-linux-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/btn-controll
          if-no-files-found: error

  format:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
