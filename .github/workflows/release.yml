name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: btn-controll-linux-x86_64-musl.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: btn-controll-linux-aarch64-musl.tar.gz
          - os: windows-latest
            target: ""
            archive: btn-controll-windows-x86_64.zip
          - os: macos-latest
            target: ""
            archive: btn-controll-macos.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Add target
        if: matrix.target != ''
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
          fi
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target "${{ matrix.target }}"
          else
            cargo build --release
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/release/btn-controll
          if [ -n "${{ matrix.target }}" ]; then
            BIN="target/${{ matrix.target }}/release/btn-controll"
          fi
          cp "$BIN" dist/
          cp buttons.json README.md LICENSE dist/
          tar -czf "${{ matrix.archive }}" -C dist .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/btn-controll.exe dist/
          Copy-Item buttons.json, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
