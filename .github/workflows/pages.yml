name: pages

# Optional. GitHub Pages must be enabled once by the repository owner:
#   Settings -> Pages -> Source: GitHub Actions
# The workflow token cannot create the Pages site itself (it lacks admin
# rights), so this workflow only deploys after that one-time switch.
# Then run it manually from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
