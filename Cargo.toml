[package]
name = "btn-controll"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "BTN Control — a tiny web control panel written in Rust"
license = "MIT"
repository = "https://github.com/qvietdpzai/btn-controll"

[dependencies]
axum = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
